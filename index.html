<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Ingreso</title>
  <meta name="description" content="Registrá el ingreso a un evento leyendo códigos QR contra una lista de asistentes. Funciona sin conexión.">
  <meta name="theme-color" content="#5A1627">
  <meta name="color-scheme" content="light dark">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- iPhone / iPad -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control Ingreso">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/palettes.js"></script>
</head>
<body>
  <!-- Íconos SVG -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="var(--cs, #fff)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24"><path d="M4 8h12l-3-3M20 16H8l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-torch" viewBox="0 0 24 24"><path d="M7 3h10l-2 7H9zM9 10v3l3 2 3-2v-3M12 15v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-kbd" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 10h.5M10 10h.5M14 10h.5M18 10h.5M7 14h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div id="bgLayer" aria-hidden="true"></div>
  <div id="bgVeil" aria-hidden="true"></div>

  <header class="appbar">
    <button class="appbar-title" id="btnEvent" aria-label="Editar datos del evento">
      <span class="t1" id="evName">Nuevo evento</span>
      <span class="t2"><span id="evSub"></span><span class="offline-pill" id="offlinePill" hidden>sin conexión</span><span class="sync-pill" id="syncPill" hidden></span></span>
    </button>
    <button class="icon-btn" id="btnExport" aria-label="Exportar resultados" title="Exportar"><svg width="22" height="22"><use href="#i-export"/></svg></button>
    <button class="icon-btn" id="btnMenu" aria-label="Opciones" title="Opciones"><svg width="22" height="22"><use href="#i-menu"/></svg></button>
  </header>

  <div class="ios-hint" id="iosHint" hidden>
    <p>Para instalar en iPhone: tocá <strong>Compartir</strong> <svg width="16" height="16" style="vertical-align:-3px"><use href="#i-share"/></svg> y luego <strong>“Agregar a inicio”</strong>.</p>
    <button class="icon-btn sm" id="iosHintClose" aria-label="Cerrar aviso"><svg width="18" height="18"><use href="#i-x"/></svg></button>
  </div>

  <main class="wrap">
    <section class="stats" aria-label="Resumen" aria-live="polite">
      <div class="stat-grid">
        <div class="stat"><b id="stTotal">0</b><span>En lista</span></div>
        <div class="stat ok"><b id="stPresent">0</b><span>Presentes</span></div>
        <div class="stat"><b id="stMissing">0</b><span>Faltan</span></div>
        <div class="stat warn"><b id="stPending">0</b><span>Por verificar</span></div>
      </div>
      <div class="progress" role="img" id="progress" aria-label="Avance de ingreso"><i id="progFill"></i></div>
      <p class="prog-txt" id="progTxt"></p>
    </section>

    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" data-tab="lista" aria-selected="true">Lista</button>
      <button role="tab" data-tab="verif" aria-selected="false">Por verificar <span class="tab-badge" id="tabBadge" hidden>0</span></button>
      <button role="tab" data-tab="reg" aria-selected="false">Registro</button>
    </nav>

    <section id="panel" class="panel"></section>

    <footer class="foot">Los datos se guardan automáticamente en este dispositivo.</footer>
  </main>

  <!-- Botón principal -->
  <div class="fab-wrap"><button class="fab" id="btnScan"><svg width="24" height="24"><use href="#i-qr"/></svg><span>Escanear QR</span></button></div>

  <!-- Escáner -->
  <div class="scanner" id="scanner" hidden role="dialog" aria-modal="true" aria-label="Lector de QR">
    <video id="scVideo" playsinline muted></video>
    <canvas id="scCanvas" hidden></canvas>
    <div class="sc-top">
      <button class="sc-btn" id="scClose" aria-label="Cerrar escáner"><svg width="22" height="22"><use href="#i-x"/></svg></button>
      <div class="sc-count" id="scCount"></div>
      <button class="sc-btn" id="scSound" aria-label="Sonido"><svg width="22" height="22"><use href="#i-volume"/></svg></button>
      <button class="sc-btn" id="scTorch" aria-label="Linterna" hidden><svg width="22" height="22"><use href="#i-torch"/></svg></button>
      <button class="sc-btn" id="scFlip" aria-label="Cambiar cámara"><svg width="22" height="22"><use href="#i-flip"/></svg></button>
    </div>
    <div class="sc-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="sc-msg" id="scMsg" hidden></div>
    <div class="sc-bottom">
      <button class="sc-btn wide" id="scType"><svg width="20" height="20"><use href="#i-kbd"/></svg><span>Escribir código</span></button>
      <button class="sc-btn wide" id="scPhoto"><svg width="20" height="20"><use href="#i-img"/></svg><span>Desde foto</span></button>
    </div>
    <div class="sc-error" id="scError" hidden></div>
  </div>

  <!-- Hoja inferior / diálogos -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <button class="icon-btn sm sheet-close" id="sheetClose" aria-label="Cerrar"><svg width="18" height="18"><use href="#i-x"/></svg></button>
    <div id="sheetBody"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>

  <!-- Área fuera de pantalla para exportar a imagen -->
  <div id="exportArea" aria-hidden="true"></div>

  <input type="file" id="fileXlsx" accept=".xlsx,.xls,.ods,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
  <input type="file" id="fileJson" accept="application/json,.json" hidden>
  <input type="file" id="fileBg" accept="image/*" hidden>
  <input type="file" id="filePhoto" accept="image/*" hidden>

  <script src="js/app.js"></script>
</body>
</html>
